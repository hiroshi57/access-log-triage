# nginx-realip.conf
#
# Cloudflare / ロードバランサ / リバースプロキシ配下で「本当のクライアント IP」を
# ログに記録するための realip モジュール設定。http {} もしくは server {} に読み込む。
#
# モジュールの有無:  nginx -V 2>&1 | tr ' ' '\n' | grep realip
# (パッケージ版には通常含まれる)
#
# 重要: set_real_ip_from には「信頼するプロキシのレンジだけ」を書く。
#       0.0.0.0/0 のように全開にすると誰でも IP を詐称できる。

# 信頼するプロキシのレンジを列挙する。
# Cloudflare の全レンジは https://www.cloudflare.com/ips/ を参照し、すべて記載する。
set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# ... 公開されているレンジをすべて記載する

real_ip_header    CF-Connecting-IP;  # 既定は X-Real-IP。経路に合わせる
real_ip_recursive off;               # 既定 off = ヘッダの最後の値を採用

# set_real_ip_from に書いていない相手からのヘッダは無視される。
