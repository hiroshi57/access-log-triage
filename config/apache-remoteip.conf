# apache-remoteip.conf
#
# Cloudflare / ロードバランサ / リバースプロキシ配下で「本当のクライアント IP」を
# ログに記録するための mod_remoteip 設定。
#
#   %a      = 復元後のクライアント IP
#   %{c}a   = 直前の接続元(= プロキシ)
#   %h      = 復元前(= プロキシの IP になってしまう)
#
# a2enmod remoteip  (Debian/Ubuntu) でモジュールを有効化しておく。

RemoteIPHeader       CF-Connecting-IP
RemoteIPTrustedProxy 173.245.48.0/20
# RemoteIPTrustedProxy 103.21.244.0/22
# ... 信頼するプロキシのレンジをすべて記載する

# ログ書式を %h から %a に変えて復元後の IP を記録する。
LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined_realip
CustomLog ${APACHE_LOG_DIR}/access.log combined_realip
